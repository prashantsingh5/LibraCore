services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-libracore}
      POSTGRES_USER: ${POSTGRES_USER:-libracore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libracore_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - libracore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  libracore_pgdata:
